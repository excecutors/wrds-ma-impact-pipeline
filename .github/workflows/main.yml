name: WRDS Merger and Aquisition Impact Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src airflow/dags --select=E9,F63,F7,F82 --count --show-source --statistics
        flake8 src airflow/dags --count --exit-zero --max-complexity=10 --max-line-length=200


    - name: Run test cases with Pytest
      run: |
        pytest tests --maxfail=1 --disable-warnings -q
