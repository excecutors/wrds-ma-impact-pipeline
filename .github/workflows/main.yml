name: WRDS Merger and Aquisition Impact Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: 3.11.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt


    - name: Lint with flake8
      run: |
        pip install flake8
        flake8 src airflow/dags --count --show-source --statistics
        flake8 src airflow/dags --count --exit-zero --max-complexity=10 --max-line-length=200


    - name: Run test cases with Pytest
      run: |
        pytest tests --maxfail=1 --disable-warnings -q
      

    - name: Validate DAGs with DagBag
      run: |
        pip install "apache-airflow==3.1.3" --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.1.3/constraints-3.11.txt"
        python - << 'EOF'
        from airflow.models import DagBag
        d = DagBag("airflow/dags")
        if d.import_errors:
            print("ERROR: DAG import errors detected:")
            for f, e in d.import_errors.items():
                print(f"\nFile: {f}\nError: {e}")
            raise SystemExit(1)
        print("SUCCESS: All DAGs imported successfully.")
        EOF
